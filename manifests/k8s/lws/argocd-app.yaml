apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lws
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: core-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: lws-system
  sources:
    - repoURL: registry.k8s.io/lws/charts
      chart: lws
      targetRevision: 0.11.0
      helm:
        valueFiles:
          - $values/k8s/lws/helm-values.yaml
    - repoURL: https://github.com/<your-org>/<your-gitops-repo>
      targetRevision: main
      ref: values
  # LWS internal cert management writes the webhook serving cert into the
  # Secret and injects caBundle into the webhook configs at runtime.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: lws-webhook-server-cert
      namespace: lws-system
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: lws-mutating-webhook-configuration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: lws-validating-webhook-configuration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
